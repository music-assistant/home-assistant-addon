name: Music Assistant DEV SERVER
# tracks the nightly base image; bumped by the server release workflow
version: 2.10.0.dev2026081603
slug: music_assistant_dev
description: Development App for Music Assistant. For developers only.
url: https://music-assistant.io
arch:
  - amd64
  - aarch64
homeassistant_api: true
discovery:
  - music_assistant
auth_api: true
host_network: true
ingress: true
ingress_port: 8094
audio: true
panel_icon: mdi:music-assistant
panel_title: Music Assistant
panel_admin: false
uart: false
apparmor: true
map:
  - media:rw
  - ssl:ro
init: false
stage: experimental
tmpfs: true
backup_exclude:
  - cache.db
  - collage_images/*
  - .cache/*
options:
  log_level: info
  server_repo: ""
  frontend_repo: ""
  safe_mode: false
schema:
  log_level: list(debug|info|warning|error)
  server_repo: str?
  frontend_repo: str?
  safe_mode: bool
privileged:
  - SYS_ADMIN
  - DAC_READ_SEARCH
